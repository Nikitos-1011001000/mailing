<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сервис рассылок</title>
</head>
<body>
    <header>
        <h1>Сервис рассылок</h1>

        <nav>
            <a href="{% url 'mailing:home' %}">
                Главная
            </a>

            <a href="{% url 'mailing:recipient_list' %}">
                Получатели
            </a>

            <a href="{% url 'mailing:message_list' %}">
                Сообщения
            </a>

            <a href="{% url 'mailing:mailing_list' %}">
                Рассылки
            </a>

            {% if user.is_authenticated %}
        	<span>Вы вошли как: {{ user.username }}</span>

            	<form method="post" action="{% url 'users:logout' %}" style="display: inline;">
			{% csrf_token %}
            		<button type="submit">Выйти</button>
        	</form>
	{% else %}
        	<a href="{% url 'users:login' %}">Войти</a>
        	<a href="{% url 'users:register' %}">Регистрация</a>
    	{% endif %}             

        </nav>

        <hr>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
