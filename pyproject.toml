[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mailing"
version = "0.1.0"
description = "Сервис управления рассылками"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django==6.0.5",
]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["mailing"]