{% extends 'base.html' %}

{% block content %}
    <h2>Восстановление пароля</h2>

    <p>
        Введите email, указанный при регистрации.
        Мы отправим ссылку для создания нового пароля.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Отправить ссылку
        </button>
    </form>

    <p>
        <a href="{% url 'users:login' %}">Вернуться ко входу</a>
    </p>
{% endblock %}
